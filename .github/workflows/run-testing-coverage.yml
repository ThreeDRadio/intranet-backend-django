name: Run tests with coverage

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual triggering from the Actions tab
  
jobs:
  test:
    environment: test
    runs-on: ubuntu-latest
    
    permissions:
      # Allows the action to publish new comments directly on trusted PRs.
      # Forked pull_request runs are downgraded to read-only by GitHub.
      pull-requests: write
      # Allows updating the python-coverage-comment-action branch and editing
      # existing comments when direct publication is allowed.
      contents: write

    services:
      postgres:
        image: postgres:10 # Specify your required PostgreSQL version
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: threed
        # Ensure the container is fully healthy before starting workflow steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --no-build-isolation -r requirements.txt
    - name: Run Tests with coverage
      run: |
        coverage run manage.py test
        coverage xml
    - name: Post Coverage Comment
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}