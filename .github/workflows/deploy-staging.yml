name: Deploy to STAGING

on:
  push:
    branches: [main, master]
  workflow_dispatch: # Allows manual triggering from the Actions tab

env:
  CR_PAT: ${{ vars.CR_PAT }}

jobs:
  test:
    environment: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16 # Specify your required PostgreSQL version
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: threed
        # Ensure the container is fully healthy before starting workflow steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --no-build-isolation -r requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --no-build-isolation -r requirements.txt
      - name: Run Tests
        env:
          CORS_ALLOW_HEADERS_ADDITIONAL: ""
          WORDPRESS_USER: "none"
          WORDPRESS_API_KEY: "none"
        run: |
          python manage.py test --keepdb

  build:
    needs: test
    environment: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        uses: SpicyPizza/create-envfile@v2.0.3
        with:
          envkey_DEBUG: "True"
          envkey_ALLOWED_HOSTS: ${{ secrets.DJ_ALLOWED_HOSTS }}
          envkey_LOGGER_DB_URL: ${{ secrets.DJ_LOGGER_DB_URL }}
          envkey_MSGLIST_DB_URL: ${{ secrets.DJ_MSGLIST_DB_URL }}
          envkey_WORDPRESS_USER: ${{ secrets.WORDPRESS_USER }}
          envkey_WORDPRESS_API_KEY: ${{ secrets.WORDPRESS_API_KEY }}
          envkey_STATIC_URL: ${{ secrets.DJ_STATIC_URL }}
          envkey_CORS_ORIGIN_WHITELIST: ${{ secrets.DJ_CORS_ORIGIN_WHITELIST }}
          envkey_CORS_ALLOW_HEADERS_ADDITIONAL: ${{ secrets.DJ_CORS_ALLOW_HEADERS_ADDITIONAL }}
          envkey_API_PREFIX: ${{ secrets.DJ_API_PREFIX }}
          envkey_CORS_ORIGIN_ALLOW_ALL: ${{ secrets.DJ_CORS_ORIGIN_ALLOW_ALL }}
          envkey_DOWNLOAD_BASE_PATH: ${{ secrets.DJ_DOWNLOAD_BASE_PATH }}
          envkey_DOWNLOAD_X_SENDFILE: ${{ secrets.DJ_DOWNLOAD_X_SENDFILE }}
          file_name: .env
          fail_on_empty: true

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag ghcr.io/threedradio/intranet-backend-django:testing --build-arg DJANGO_ENV=staging

      - name: Login to the GitHub Docker registry
        run: echo $CR_PAT | docker login ghcr.io -u threedradio --password-stdin

      - name: Push the Docker image to ghcr.io
        run: docker push ghcr.io/threedradio/intranet-backend-django:testing

  deploy:
    needs: build
    environment: test
    runs-on: ubuntu-latest

    steps:
      - name: Pull the new Docker image from GitHub and restart the container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT }}
          script: |
            echo ${{ vars.CR_PAT }} | docker login ghcr.io -u threedradio --password-stdin
            # chown 10001 /srv/docker/intranet-backend-django/keys/server.key
            # chown 10001 /srv/docker/intranet-backend-django/certs/server.crt
            docker stop intranet-backend-django
            docker container rm intranet-backend-django
            docker pull ghcr.io/threedradio/intranet-backend-django:testing
            docker run \
              -p 8001:443 \
              --restart always \
              --name intranet-backend-django \
              -e SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
              -e SENTRY_ENVIRONMENT="${{ vars.SENTRY_ENVIRONMENT }}" \
              -e SENTRY_RELEASE="${{ github.sha }}" \
              -v /srv/docker/intranet-backend-django/keys/server.key:/etc/apache2/ssl/ssl.key/server.key:z \
              -v /srv/docker/intranet-backend-django/certs/server.crt:/etc/apache2/ssl/ssl.crt/server.crt:z \
              -v /data:/data:z \
              -d \
              -t ghcr.io/threedradio/intranet-backend-django:testing
